# 실측 대표 입력 4건 — data/*.json의 issues[0](rank 1)에서
# sourceTitle/sourceDesc를 원문 그대로 가져왔다(각색 금지).
- description: "08-08 pm 폭염 사망 23명 (누적 수치)"
  vars:
    sourceTitle: "연일 폭염에 온열질환 사망 23명…정부, 비상대응기구 가동"
    sourceDesc: "연일 폭염이 이어지면서 올해 누적 온열질환 사망자가 23명에 달했다. 정부는 폭염 피해를 최소화하기 위해 비상대응기구를 가동하고 국민의 각별한 주의를 당부했다."

- description: "08-09 am 여수 모터보트 전복 (사건·사망 수치)"
  vars:
    sourceTitle: "여수 해상서 5명 탄 유람용 모터보트 뒤집혀... 선장 등 2명 사망"
    sourceDesc: "여수시 오동도 인근 해상에서 5명이 탑승한 유람용 모터보트가 전복됐다. 선장 등 2명이 숨졌고 나머지 3명은 부상을 입어 병원에서 치료를 받고 있다."

- description: "08-09 pm 폭염 지속 (수치 2건·절기)"
  vars:
    sourceTitle: "올해 온열질환자 2872명·사망 23명 발생…입추에도 폭염 계속"
    sourceDesc: "올해 누적 온열질환자는 2872명으로 늘었고, 누적 사망자는 23명으로 집계됐다. 기록적인 폭염이 이어지면서 온열질환자가 연일 200명 안팎으로 발생하고 있다. 입추가 지났지만 폭염은 계속되고 있다."

- description: "08-10 am 인천 존속살해 (강력사건)"
  vars:
    sourceTitle: "인천서 말다툼 중 어머니 살해 10대 구속…범행 후 반려견도 죽여"
    sourceDesc: "말다툼을 하던 어머니를 흉기로 찔러 살해한 혐의를 받는 10대 아들이 구속됐다. 범행 이후 집 안의 반려견도 죽인 것으로 드러났다."
