# 실측 대표 입력 5건 — data/*.json의 issues[0](rank 1)에서
# sourceTitle/sourceDesc/title을 원문 그대로 가져왔다(각색 금지).
# title은 화면에 따로 뜨는 카드 제목이다 — dupWithTitle 프로브의 대조 기준.
# 10-01 pm(검찰청)은 같은 소재 뉴닉 행동 번역 훅과 대조한 기준 회차라 반드시 포함한다.
# 10-05 pm(오키나와)은 행동 각도가 원문에 없는 사건형 — "시청자 관점 질문" 폴백을 시험한다.
- description: "10-01 pm 검찰청 폐지 D-1 (행동 각도가 원문 제목에 있음)"
  vars:
    sourceTitle: "檢 폐지 D-1…법조계 내 사건 수사할 수 있는 기관부터 확인"
    sourceDesc: "내일(10월 2일)부터 검찰청이 폐지되고 공소청과 중대범죄수사청(중수청)이 출범한다. 검찰청법 제정 이후 78년 만에 수사·기소를 함께 수행하던 체계가 종료되며, 법조계에서는 사건별로 수사할 수 있는 기관이 어디인지 파악이 급선무가 됐다."
    title: "검찰청 78년 역사 마감, 내일부터 공소청·중수청"

- description: "10-05 am 금융사 7곳 해킹 (개인정보 유출, 당사자 행동)"
  vars:
    sourceTitle: "금융사 7곳 뚫렸다… 개인 6만6천명·법인 2200건 정보 유출 [금융권 전방위 해킹]"
    sourceDesc: "이달 들어 외부 해킹으로 정보유출이 확인된 곳은 신한·KB국민·하나·BNK부산은행과 현대캐피탈, 예가람·웰컴저축은행 등 7곳으로, 개인 6만6천명·법인 2200건의 정보가 유출됐다. 금융위원회는 4일 전 금융권 협회장과 피해 금융사 대표를 긴급 소집했다."
    title: "금융사 7곳 해킹, 6만6천명 정보 유출"

- description: "09-23 am 추석 귀성길 사고위험 (시간대 주의, 행동 안내)"
  vars:
    sourceTitle: "추석 귀성길 23일 사고위험 최고…평소보다 45% 급증"
    sourceDesc: "추석 연휴 전날인 23일 귀성 차량이 몰려 교통사고가 평소보다 45% 급증한다는 분석이 나왔다. 시간대별로는 오후 4~6시에 피해자가 집중되며, 추석 당일에는 사고 건수가 줄어도 사고당 피해 규모가 크게 늘어 각별한 주의가 필요하다."
    title: "추석 귀성길 오늘이 가장 위험합니다"

- description: "09-25 am 서울 아파트값 85주 연속 상승 (생활 변화)"
  vars:
    sourceTitle: "서울 아파트값 85주 연속 상승…역대 최장 기록과 타이"
    sourceDesc: "서울 아파트 매매가격이 85주째 상승하며 역대 최장 상승 기간 기록과 동률을 기록했다. 강남권 약세에도 중하위권 지역이 상승을 견인했다."
    title: "서울 아파트 85주 연속 상승"

- description: "10-05 pm 오키나와 강도살인 (사건형, 행동 각도 없음 폴백)"
  vars:
    sourceTitle: "오키나와 호텔서 30대 여성 숨져…미 해병대원 강도살인 혐의 체포"
    sourceDesc: "오키나와현 나하시 호텔에서 30대 현지 여성이 숨진 채 발견됐으며, 경찰은 후텐마 비행장 소속 미 해병대원을 강도살인 혐의로 긴급 체포했다. 용의자는 피해 여성의 지갑 등을 빼앗은 혐의를 받으며, 일본 정부는 미국에 강력 항의하고 재발 방지를 요구했다."
    title: "오키나와 미 해병대원, 여성 강도살인 체포"
