name: contract-check

# 뉴스 재작성/hookLine 프롬프트 계약(contracts/*)의 결정적 회귀 게이트.
# contracts/** 변경이 push/PR될 때 ratchetlock check(replay — API 키·claude CLI 불필요)를 돌려
# 동결 기준선이 깨졌는지 본다. 회귀 시 exit 1 → 빌드 실패 + 텔레그램 알림.
on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      # asserts.js가 공유하는 프로브 모듈 — 이 파일 변경도 계약 회귀를 만들 수 있다(2026-08-10 구멍 발견)
      - "scripts/rewrite-probes.cjs"
      # 신호 수집기·픽스처·push 재시도 스크립트(2026-09-29 signals-actions)
      - "scripts/collect.mjs"
      - "scripts/signals-push.sh"
      - "test/fixtures/signals/**"
      # 실험 큐·판정기·입력 감시 계약(2026-09-29) — experiments 잡이 lint·self-test를 돈다.
      - "experiments/**"
      - "scripts/experiment.mjs"
      - "scripts/health.mjs"
      - "scripts/flags.mjs"
      - "scripts/kpi.mjs"
      - "test/fixtures/experiments/**"
      - "test/fixtures/health/**"
      # 오리 기자 릴스 레이아웃 계약(2026-10-05) — layout 잡이 keyStat 테스트·안전 영역 검사를 돈다.
      - "reels/src/**"
      - "reels/layout-cli.mjs"
      - "reels/package-lock.json"
      - "scripts/layout-check.mjs"
      - "test/fixtures/ai-layout-*.json"
      - "test/fixtures/ai-2099-01-01.json"
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/rewrite-probes.cjs"
      - "scripts/collect.mjs"
      - "scripts/signals-push.sh"
      - "test/fixtures/signals/**"
      - "experiments/**"
      - "scripts/experiment.mjs"
      - "scripts/health.mjs"
      - "scripts/flags.mjs"
      - "scripts/kpi.mjs"
      - "test/fixtures/experiments/**"
      - "test/fixtures/health/**"
      - "reels/src/**"
      - "reels/layout-cli.mjs"
      - "reels/package-lock.json"
      - "scripts/layout-check.mjs"
      - "test/fixtures/ai-layout-*.json"
      - "test/fixtures/ai-2099-01-01.json"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: Node 20 설치
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # 신호 수집기 파서·창·컷오프 self-test와 push 재시도 self-test(로컬 bare repo, 네트워크 불필요)
      - name: signals 수집기 self-test
        run: node scripts/collect.mjs --self-test

      - name: signals push 재시도 self-test
        run: bash scripts/signals-push.sh --self-test

      - name: ratchetlock 설치
        run: npm install --no-save github:calintzy/ratchetlock#v0.4.0

      - name: 결정적 check (replay)
        run: cd contracts/rewrite && npx ratchetlock check --probe-locked

      - name: 결정적 check (hook)
        run: cd contracts/hook && npx ratchetlock check --probe-locked

      # 물어오리 전용 훅 v2 계약(2026-09-14) — contracts/hook(오리 기자)과 별도 기준선이다.
      - name: 결정적 check (hook-muleori)
        run: cd contracts/hook-muleori && npx ratchetlock check --probe-locked

      - name: 실패 시 텔레그램 알림
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=[물어오리] 프롬프트 계약 check 실패 — contracts/* 회귀 확인 필요"

  # 실험 큐 lint + 판정기·health self-test(음성 대조군 포함). 결정적이라 API 키가 필요 없다.
  experiments:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: Node 20 설치
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: queue lint
        run: node scripts/experiment.mjs --lint

      - name: flags.json 계약
        run: node scripts/flags.mjs --check experiments/flags.json

      - name: 판정기 self-test
        run: node scripts/experiment.mjs --self-test

      - name: 판정기 음성 대조군 (기대를 틀리게 적은 케이스는 반드시 실패)
        run: |
          if node scripts/experiment.mjs --self-test --cases test/fixtures/experiments/negative-cases.json; then
            echo "음성 대조군이 통과함 — self-test 비교기 고장"; exit 1
          fi

      - name: health self-test
        run: node scripts/health.mjs --self-test

      - name: health 음성 대조군
        run: |
          if node scripts/health.mjs --self-test --cases test/fixtures/health/negative-cases.json; then
            echo "음성 대조군이 통과함 — self-test 비교기 고장"; exit 1
          fi

      - name: KPI 회귀 계약 (골든)
        run: node scripts/kpi.mjs metrics/2026-09-29.json | cmp - test/fixtures/kpi-2026-09-29.golden.md

  # 오리 기자 릴스 레이아웃 계약(2026-10-05) — 실제 스틸 렌더에서 글자가 인스타그램 안전 영역 안인지 판정한다.
  # 음성 대조군(넘치는 픽스처)은 반드시 실패해야 한다 — 통과하면 검사기 고장이다.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: Node 20 설치
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reels/package-lock.json

      - name: CJK 폰트 설치 (한글 렌더)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: reels 의존성 설치
        working-directory: reels
        run: npm ci

      - name: keyStat 테스트
        run: node --test reels/src/keyStat.test.mjs

      - name: layout-check (기본 픽스처)
        run: node scripts/layout-check.mjs test/fixtures/ai-2099-01-01.json

      - name: layout-check (최대 길이 픽스처)
        run: node scripts/layout-check.mjs test/fixtures/ai-layout-max.json

      # Anti-ISC-2: 프로덕션 props(layoutProbe 없음)에서는 probe 로그가 0줄이어야 한다.
      - name: probe 꺼짐 확인 (layoutProbe 없이 LAYOUT 줄 0건)
        run: |
          node reels/layout-cli.mjs test/fixtures/ai-2099-01-01.json --no-probe | grep -x "layout-lines: 0"

      - name: layout-check 음성 대조군 (넘치는 픽스처는 반드시 실패)
        run: |
          if node scripts/layout-check.mjs test/fixtures/ai-layout-overflow.json; then
            echo "음성 대조군이 통과함 — layout-check 비교기 고장"; exit 1
          fi

      - name: 실패 시 텔레그램 알림
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=[오리 기자] 릴스 레이아웃 계약 실패 — 안전 영역·keyStat 회귀 확인 필요"
