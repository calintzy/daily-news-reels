name: contract-check

# 뉴스 재작성/hookLine 프롬프트 계약(contracts/*)의 결정적 회귀 게이트.
# contracts/** 변경이 push/PR될 때 ratchetlock check(replay — API 키·claude CLI 불필요)를 돌려
# 동결 기준선이 깨졌는지 본다. 회귀 시 exit 1 → 빌드 실패 + 텔레그램 알림.
on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      # asserts.js가 공유하는 프로브 모듈 — 이 파일 변경도 계약 회귀를 만들 수 있다(2026-08-10 구멍 발견)
      - "scripts/rewrite-probes.cjs"
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/rewrite-probes.cjs"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: Node 20 설치
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: ratchetlock 설치
        run: npm install --no-save github:calintzy/ratchetlock

      - name: 결정적 check (replay)
        run: cd contracts/rewrite && npx ratchetlock check

      - name: 결정적 check (hook)
        run: cd contracts/hook && npx ratchetlock check

      - name: 실패 시 텔레그램 알림
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=[물어오리] 프롬프트 계약 check 실패 — contracts/* 회귀 확인 필요"
