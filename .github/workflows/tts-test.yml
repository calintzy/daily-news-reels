name: tts-test

# 사람 승인 게이트 — 과거 회차를 TTS 팔로 렌더만 하고 artifact로 받는다.
# 렌더 산출물은 워킹카피에만 생기고 커밋하지 않음 — 기존 발행본 훼손 없음.

on:
  workflow_dispatch:
    inputs:
      stem:
        description: '렌더할 회차 키(예: 2026-08-16-am)'
        required: true

jobs:
  tts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: CJK 폰트·ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: edge-tts 설치
        run: python -m pip install "edge-tts==7.2.8"

      - name: edge-tts 스모크 (GitHub Actions IP 차단 여부 판정)
        run: |
          edge-tts --voice ko-KR-SunHiNeural --text "테스트입니다" --write-media /tmp/smoke.mp3
          test -s /tmp/smoke.mp3

      - name: reels 의존성 설치
        working-directory: reels
        run: npm ci

      - name: TTS 팔 강제 렌더 (커밋 없음)
        env:
          REELS_ARM: tts
          TTS_ENABLED: '1'
        run: node scripts/render.mjs "data/${{ inputs.stem }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: tts-test
          path: |
            docs/videos/${{ inputs.stem }}.mp4
            docs/previews/${{ inputs.stem }}-*.jpg
