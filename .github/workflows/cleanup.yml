name: cleanup

on:
  schedule:
    - cron: '17 19 * * *' # 04:17 KST — 발행·인사이트와 겹치지 않는 새벽
  workflow_dispatch:

# reels.yml과 같은 그룹으로 직렬화(산출물 커밋 경합 방지)
concurrency:
  group: reels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 보존 14일 경과 산출물 정리
        run: node scripts/cleanup.mjs

      - name: 정리 결과 커밋·푸시
        run: |
          git config user.name calintzy
          git config user.email byjrasid@gmail.com
          git add docs/videos docs/previews assets/img
          git commit -m "cleanup: 보존 14일 경과 산출물 정리" || echo "커밋 변경 없음"
          git pull --rebase origin main || true
          git push
