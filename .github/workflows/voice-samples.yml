name: voice-samples

# TTS 보이스 후보 비교용 일회성 샘플 생성 (2026-08-17 훅 수술 2단계 보이스 선정 — 선정 후 삭제 예정)
on:
  workflow_dispatch:

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - name: OpenAI gpt-4o-mini-tts 샘플 3종 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p samples
          TXT="남부, 제주, 오늘 폭우에 강풍까지 옵니다. MSCI 선진국 편입, 39개 과제 중 30개 완료."
          INST="차분하고 자연스러운 한국어 뉴스 앵커 톤. 서두르지 않고 또박또박, 기계적이지 않게."
          for V in ash nova coral; do
            curl -sf https://api.openai.com/v1/audio/speech \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"gpt-4o-mini-tts\",\"voice\":\"$V\",\"input\":\"$TXT\",\"instructions\":\"$INST\",\"response_format\":\"mp3\"}" \
              -o "samples/openai-$V.mp3"
            test -s "samples/openai-$V.mp3" && echo "$V OK"
          done
          ls -la samples/

      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: samples/
